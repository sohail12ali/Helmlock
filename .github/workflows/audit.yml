# Weekly dependency audit (F147). A finding fails this run (red in the Actions tab) and opens or updates one issue.
name: audit

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11

      - name: pnpm audit --prod
        id: audit
        shell: bash
        run: |
          set +e
          pnpm audit --prod > audit.txt 2>&1
          code=$?
          cat audit.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open or update the audit issue
        if: steps.audit.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="Dependency audit: pnpm audit --prod found issues"
          body="$(printf 'Weekly audit run %s found advisories.\n\n```\n%s\n```\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$(head -c 60000 audit.txt)")"
          existing="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label dependencies || gh issue create --title "$title" --body "$body"
          fi

      - name: Fail visibly
        if: steps.audit.outputs.code != '0'
        run: |
          echo "pnpm audit --prod reported advisories; see the issue opened above."
          exit 1
