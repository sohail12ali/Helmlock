<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Helmlock">
  <title>Helmlock</title>
  <defs>
    <!-- user-space gradients so straight lines and rects all get painted -->
    <linearGradient id="hl-tile" gradientUnits="userSpaceOnUse" x1="2" y1="2" x2="62" y2="62">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="hl-body" gradientUnits="userSpaceOnUse" x1="0" y1="26" x2="0" y2="58">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#hl-tile)"/>
  <!-- the lock: shackle and body -->
  <path d="M21 28v-6.5a11 11 0 0 1 22 0V28" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
  <rect x="11" y="26" width="42" height="32" rx="7" fill="url(#hl-body)"/>
  <!-- the helm, where the keyhole would be -->
  <g stroke="#0b1f4d" stroke-linecap="round" fill="none">
    <g stroke-width="2.6">
      <line x1="32" y1="29.6" x2="32" y2="54.4"/>
      <line x1="19.6" y1="42" x2="44.4" y2="42"/>
      <line x1="23.2" y1="33.2" x2="40.8" y2="50.8"/>
      <line x1="40.8" y1="33.2" x2="23.2" y2="50.8"/>
    </g>
    <circle cx="32" cy="42" r="8.4" stroke-width="2.8"/>
  </g>
  <circle cx="32" cy="42" r="3.4" fill="#0b1f4d"/>
</svg>
