<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Helmlock">
  <title>Helmlock</title>
  <!-- tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0a0a0a"/>
  <!-- helm: eight handles and spokes, and the rim -->
  <g stroke="#ffffff" stroke-linecap="round" fill="none">
    <g stroke-width="4.2">
      <line x1="32" y1="5.5" x2="32" y2="58.5"/>
      <line x1="5.5" y1="32" x2="58.5" y2="32"/>
      <line x1="13.3" y1="13.3" x2="50.7" y2="50.7"/>
      <line x1="50.7" y1="13.3" x2="13.3" y2="50.7"/>
    </g>
    <circle cx="32" cy="32" r="18.5" stroke-width="4.6"/>
  </g>
  <!-- hub: a padlock -->
  <circle cx="32" cy="32" r="11.6" fill="#0a0a0a" stroke="#ffffff" stroke-width="1.6"/>
  <path d="M27.2 31.2v-3.1a4.8 4.8 0 0 1 9.6 0v3.1" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
  <rect x="24.6" y="30.4" width="14.8" height="10.6" rx="2.6" fill="#ffffff"/>
  <circle cx="32" cy="34.6" r="1.7" fill="#0a0a0a"/>
  <rect x="31.1" y="35.2" width="1.8" height="3.4" rx="0.9" fill="#0a0a0a"/>
</svg>
