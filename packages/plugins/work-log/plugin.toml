id = "work-log"
kind = "code"
version = "0.1.0"
requires_core = ">=1 <2"
provides = ["worklog"]
requires = ["roster"]
verbs = ["log-work", "log show"]
entry = "index.ts"

[settings.day_hours]
type = "number"
label = "Working day (hours)"
hint = "Hours a day's work-log entries are spread over when no hours are pinned."
default = 8
min = 0.25
max = 24
scope = "workspace"
section = "workspace"
