id = "providers"
kind = "code"
version = "0.1.0"
requires_core = ">=1 <2"
provides = ["providers"]
requires = []
verbs = []
entry = "index.ts"

# Providers and models are arrays in the row's config (providers = [{ id, preset, base_url, key_env, compat }],
# models = [{ id = "<provider>/<model>", provider, context_window, max_tokens, capabilities }]); the scalar
# choices below are the Settings screen's Models section.

[settings.default_model]
type = "string"
label = "Default model"
hint = "Model id (provider/model) used for new chats and every role without its own model."
scope = "workspace"
section = "models"
applies = "live"

[settings.assistant_model]
type = "string"
label = "Assistant model"
hint = "Model for the console and Telegram assistant. Empty = the default model."
scope = "workspace"
section = "models"
applies = "live"

[settings.summariser_model]
type = "string"
label = "Summariser model"
hint = "Model that shortens old chat turns and digests. Empty = the default model."
scope = "workspace"
section = "models"
applies = "live"

[settings.titles_model]
type = "string"
label = "Titles model"
hint = "Model that names chats. Empty = the default model."
scope = "workspace"
section = "models"
applies = "live"

[settings.refiner_model]
type = "string"
label = "Refiner model"
hint = "Model that cleans up dictated text. Empty = the default model."
scope = "workspace"
section = "models"
applies = "live"
